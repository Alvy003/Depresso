<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games Hub</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #e0e0e0;
        }
        .container {
            max-width: 1200px;
            margin: auto;
            padding: 40px;
            text-align: center;
        }
        h1 {
            font-size: 2.5em;
            color: #fff;
            margin-bottom: 40px;
            font-weight: bold;
        }
        .game-box {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 30px;
            margin-top: 40px;
        }
        .game-card {
            background: #1e1e1e;
            border-radius: 12px;
            width: 250px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .game-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.7);
        }
        .game-card img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .game-card h2 {
            color: #fff;
            font-size: 1.5em;
            margin-bottom: 15px;
        }
        .game-card p {
            color: #ccc;
            font-size: 1em;
            margin-bottom: 20px;
        }
        .play-button {
            text-decoration: none;
            background-color: #269c7b;
            color: #fff;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }
        .play-button:hover {
            background-color: #046c3c;
            transform: scale(1.05);
        }
    .atxt{
    text-decoration: none;
    color: rgb(168, 54, 54); /* Change default text color to white */
    font-size: 30px;
    margin-left: 15px;
    position: relative; /* To position the underline effect */
    transition: color 0.3s ease; /* Smooth color transition */
    margin-top: 10px;
    margin-bottom: 50px;
    font-weight: bold;
    
    
    
}
#att{
    background-color: rgb(5, 143, 97);
}
.atxt:hover,
.atxt.active {
  color:rgb(88, 86, 86); /* Change color on hover or active state */
}

    </style>
</head>
<body>
    <div class="atxt" >
        <a href="/home">
            <i class="bi bi-house" style="color: rgb(37, 178, 86);"></i>

        </a>
    </div>
    <div class="container">
        <h1>Welcome to the Wellness Zone</h1>
        <p>Choose a game to play!</p>
        <div class="game-box">
            <div class="game-card">
                <img src="/static/images/egg.webp" alt="Game 1">
                <h2>Pirate's Eye</h2>
                <p>Fun Game</p>
                <a href="/egghen" class="play-button">Play Now</a>
            </div>
            <div class="game-card">
                <img src="/static/images/semor pair.webp" alt="Game 2">
                <h2>Semor Pair</h2>
                <p>Memory Game</p>
                <a href="/memorypair" class="play-button">Play Now</a>
            </div>
            <div class="game-card">
                <img src="/static/images/minecraft.webp" alt="Game 3">
                <h2>Colour Burst</h2>
                <p>Puzzle Game</p>
                <a href="/colourburst" class="play-button">Play Now</a>
            </div>
            
        </div>
    </div>
</body>
</html>
